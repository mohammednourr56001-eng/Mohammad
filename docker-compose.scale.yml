# ==============================================================================
# منصة UST للمحاضرات — Horizontal Scale Architecture Stack
# Nginx Load Balancer + 3x Stateless App Replicas + Redis + PgBouncer + Postgres
# ==============================================================================
version: "3.9"

services:
  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ust-app-1
      - ust-app-2
      - ust-app-3
    restart: unless-stopped

  ust-app-1:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=ust-node-1
      - REDIS_URL=redis://redis:6379
      - SERVER_REPLICAS_CONFIGURED=3
      - AI_MAX_CONCURRENT_JOBS=4
    depends_on:
      - redis
    restart: unless-stopped

  ust-app-2:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=ust-node-2
      - REDIS_URL=redis://redis:6379
      - SERVER_REPLICAS_CONFIGURED=3
      - AI_MAX_CONCURRENT_JOBS=4
    depends_on:
      - redis
    restart: unless-stopped

  ust-app-3:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=ust-node-3
      - REDIS_URL=redis://redis:6379
      - SERVER_REPLICAS_CONFIGURED=3
      - AI_MAX_CONCURRENT_JOBS=4
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=ust_platform
      - POSTGRES_USER=ust_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_prod}
    volumes:
      - ./docs/reference_postgresql_rls_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ust_admin
      - DB_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_prod}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=60
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      - postgres
    ports:
      - "6432:5432"
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:

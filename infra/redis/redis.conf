# =============================================================================
# UST Platform — Production Redis Configuration (Cache & Rate-Limit Store)
# =============================================================================
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Memory & Eviction Policy (Cache-Aside Pattern)
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Persistence (RDB snapshots + AOF for queue resilience)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Concurrency & Safety
maxclients 10000
slowlog-log-slower-than 10000
slowlog-max-len 256
rename-command FLUSHDB ""
rename-command FLUSHALL ""

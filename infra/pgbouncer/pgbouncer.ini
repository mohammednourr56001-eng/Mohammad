[databases]
ust_platform = host=postgres port=5432 dbname=ust_platform
ust_platform_ro = host=postgres_replica port=5432 dbname=ust_platform

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction-level pooling minimizes backend PostgreSQL connection saturation
pool_mode = transaction
max_client_conn = 2500
default_pool_size = 60
min_pool_size = 10
reserve_pool_size = 20
reserve_pool_timeout = 3
server_idle_timeout = 120
server_lifetime = 1800
query_wait_timeout = 10
client_idle_timeout = 300
ignore_startup_parameters = extra_float_digits

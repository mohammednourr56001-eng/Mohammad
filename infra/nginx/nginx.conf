worker_processes auto;
events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Layered Rate Limiting Zones (Edge Spike Protection)
  limit_req_zone $binary_remote_addr zone=ust_public_zone:20m rate=40r/s;
  limit_req_zone $binary_remote_addr zone=ust_exam_zone:20m rate=15r/s;
  limit_req_zone $binary_remote_addr zone=ust_ai_zone:10m rate=2r/s;

  upstream ust_app_cluster {
    least_conn;
    server ust-app-1:3000 max_fails=3 fail_timeout=15s;
    server ust-app-2:3000 max_fails=3 fail_timeout=15s;
    server ust-app-3:3000 max_fails=3 fail_timeout=15s;
    keepalive 128;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 55M;

    # Immutable static asset caching
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2|webp)$ {
      proxy_pass http://ust_app_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Liveness / Readiness Probes
    location ~ ^/api/(liveness|readiness|health)$ {
      proxy_pass http://ust_app_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      access_log off;
    }

    # AI Queue Endpoint Strict Rate Guard
    location /api/ai/ {
      limit_req zone=ust_ai_zone burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://ust_app_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # Exam Traffic Protection
    location /api/exams/ {
      limit_req zone=ust_exam_zone burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://ust_app_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
    }

    # General Application Traffic
    location / {
      limit_req zone=ust_public_zone burst=80 nodelay;
      limit_req_status 429;
      proxy_pass http://ust_app_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}

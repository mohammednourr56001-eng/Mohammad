apiVersion: apps/v1
kind: Deployment
metadata:
  name: ust-platform-web
  labels:
    app: ust-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ust-platform
  template:
    metadata:
      labels:
        app: ust-platform
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ust-web
          image: ghcr.io/ust-platform/ust-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ust-secrets
                  key: redis_url
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ust-secrets
                  key: gemini_api_key
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/liveness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/readiness
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ust-platform-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ust-platform-web
  minReplicas: 3
  maxReplicas: 55
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ust-platform-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ust-platform
---
# Pre-exam scheduled scaling warm-up before peak university exam windows (07:45 UTC daily)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ust-pre-exam-cache-warmup
spec:
  schedule: "45 7 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: warmup
              image: curlimages/curl:8.10.1
              args:
                - /bin/sh
                - -c
                - "curl -sf http://ust-platform-web:3000/api/catalog/seed > /dev/null && curl -sf http://ust-platform-web:3000/api/exams > /dev/null"
